
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Todo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 25px;
        }

        .edit-box {
            max-width: 450px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 10px #ddd;
        }

        h2 {
            text-align: center;
            color: #354b8c;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 18px;
            background: #354b8c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .back {
            margin-left: 10px;
            color: #354b8c;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="edit-box">
        <h2>Edit Todo Details</h2>

        <form action="/edit" method="post">

            <input type="hidden" name="e_id" value="{{ t1.id }}">

            <label for="e_title">Title</label>
            <input type="text" name="e_title" id="e_title"
                   value="{{ t1.title }}" required>

            <label for="e_description">Description</label>
            <input type="text" name="e_description" id="e_description"
                   value="{{ t1.description }}" required>

            <label for="e_priority">Priority</label>
            <select name="e_priority" id="e_priority">
                <option value="high"
                    {% if t1.priority == "high" %}selected{% endif %}>
                    High
                </option>
                <option value="medium"
                    {% if t1.priority == "medium" %}selected{% endif %}>
                    Medium
                </option>
                <option value="low"
                    {% if t1.priority == "low" %}selected{% endif %}>
                    Low
                </option>
            </select>

            <label for="e_is_completed">Status</label>
            <select name="e_is_completed" id="e_is_completed">
                <option value="True"
                    {% if t1.is_complited == "True" %}selected{% endif %}>
                    Completed
                </option>
                <option value="False"
                    {% if t1.is_complited == "False" %}selected{% endif %}>
                    Pending
                </option>
            </select>

            <label for="e_due_date">Due Date</label>
            <input type="date" name="e_due_date" id="e_due_date"
                   value="{{ t1.due_date.strftime('%Y-%m-%d') }}" required>

            <button type="submit">Update Todo</button>
            <a href="/get" class="back">Cancel</a>

        </form>
    </div>

</body>
</html>
